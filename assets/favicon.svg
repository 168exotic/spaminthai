    <path d="M204 128q14-34 52-34t52 34"/>
    <path d="M230 130q8-15 26-15t26 15"/>
  </g>
  <circle cx="256" cy="120" r="7" fill="#a5bdce"/>

  <rect x="179" y="143" width="154" height="225" rx="29" fill="#fff"/>
  <rect x="192" y="165" width="128" height="180" rx="13" fill="#06243d"/>
  <circle cx="256" cy="155" r="6" fill="#9cb5c8"/>
  <rect x="237" y="355" width="38" height="7" rx="3.5" fill="#9db6ca"/>

  <g fill="none" stroke="#ff4d57" stroke-width="23" filter="url(#glow)">
