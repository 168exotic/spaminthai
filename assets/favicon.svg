<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">SpamInThai — ป้องกันสายมิจฉาชีพ</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#03182c"/>
      <stop offset="1" stop-color="#06243d"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#163e61"/>
      <stop offset="1" stop-color="#082943"/>
    </linearGradient>
    <pattern id="hex" width="52" height="45" patternUnits="userSpaceOnUse">
