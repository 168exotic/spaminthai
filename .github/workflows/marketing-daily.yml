name: Marketing — 4× daily

# Auto-post to Telegram/Discord + IndexNow. 4 slots/day Thailand time.
# UTC: 01:00, 05:00, 09:00, 13:00 = 08:00, 12:00, 16:00, 20:00 (UTC+7)

on:
  schedule:
    - cron: '0 1,5,9,13 * * *'
  workflow_dispatch:

concurrency:
  group: marketing-daily
  cancel-in-progress: false

jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: SEO ping + IndexNow
        run: node scripts/seo-ping.mjs https://spaminthai.com
        continue-on-error: true

      - name: Run marketing automation (Telegram / Discord)
        env:
          MARKETING_CRON_SECRET: ${{ secrets.MARKETING_CRON_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2fa3f2f325707bab89ef1c7452d3adb8' }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID || '0a479fd6d75c431b8e7018caf819f7b2' }}
          SITE_URL: https://spaminthai.com
        run: |
          case "$TELEGRAM_BOT_TOKEN$TELEGRAM_CHAT_ID$MARKETING_CRON_SECRET" in
            *$'\n'*) echo "::error title=Bad secret::A marketing secret contains a line break. Each secret must hold ONE value: TELEGRAM_BOT_TOKEN = bot token only, TELEGRAM_CHAT_ID = @spaminthaich, MARKETING_CRON_SECRET = one line (or delete it)."; exit 1 ;;
          esac
          if { [ -n "$TELEGRAM_BOT_TOKEN" ] || [ -n "$DISCORD_WEBHOOK_URL" ]; } && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            # Real numbers from production KV via Cloudflare API, posted directly
            # (GitHub runners get 403 from spaminthai.com, so the API route is a fallback).
            node scripts/marketing-automation.mjs --kv
          elif [ -n "$MARKETING_CRON_SECRET" ]; then
            node scripts/marketing-automation.mjs
          else
            echo "::warning title=Marketing not posting::Dry run only (mock data, nothing posted). Set TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID (and CLOUDFLARE_API_TOKEN), or MARKETING_CRON_SECRET."
            node scripts/marketing-automation.mjs --local
          fi

      - name: Verify feed.xml
        run: |
          curl -fsS https://spaminthai.com/feed.xml | head -20
          echo "feed.xml OK"
