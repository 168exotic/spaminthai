name: Affiliate Link Check

# ตรวจสอบสุขภาพลิงก์โฆษณา Affiliate ก่อน deploy ไป spaminthai.com
# - รันเมื่อแก้ไฟล์ที่เกี่ยวกับโฆษณา / config / workflow นี้
# - เตือน (ไม่ fail) ถ้ายังมี slot ที่ยังไม่ได้ใส่ลิงก์จริง (placeholder)
on:
  pull_request:
    paths:
      - 'assets/affiliate.js'
      - 'assets/affiliate.css'
      - 'index.html'
      - 'check.html'
      - 'scripts/check-affiliate-links.py'
      - '.github/workflows/affiliate-link-check.yml'
  push:
    branches: [main]
    paths:
      - 'assets/affiliate.js'
      - 'assets/affiliate.css'
      - 'scripts/check-affiliate-links.py'
      - '.github/workflows/affiliate-link-check.yml'
  workflow_dispatch:

jobs:
  affiliate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run affiliate config health check
        run: python3 scripts/check-affiliate-links.py
