name: Deploy VPS (เบอร์ใคร.com)

on:
  push:
    branches:
      - main
    paths:
      - 'vps/www/**'
  workflow_dispatch:

concurrency:
  group: deploy-vps-berkrai
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy static site to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "::error::Missing VPS_SSH_KEY secret — see .github/SECRETS-SETUP.md"
            exit 1
          fi
          HOST="${VPS_HOST:?VPS_SSH_HOST secret required}"
          USER="${VPS_USER:-root}"
          DEST="${VPS_PATH:-/var/www/spaminthai/public}"
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          rsync -avz --delete \
            -e "ssh -i $KEY_FILE -o StrictHostKeyChecking=accept-new" \
            vps/www/ "${USER}@${HOST}:${DEST}/"
          echo "Deployed vps/www → ${USER}@${HOST}:${DEST}"
