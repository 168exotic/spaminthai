name: Deploy to Cloudflare Pages

# Deploys spaminthai.com from THIS repo — the single source of truth since 2026-09-29
# (the 168exotic/mysite deploy/spaminthai overlay was merged in here and retired).
# Every app download button must point at the Google Play listing; the build fails
# if a legacy APK / /download link slips back in.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      cloudflare_api_token:
        description: 'Cloudflare API token (only if CLOUDFLARE_API_TOKEN secret is missing)'
        required: false
        type: string

concurrency:
  group: deploy-spaminthai
  cancel-in-progress: true

env:
  PAGES_PROJECT: spaminthai
  # Default account; override with CLOUDFLARE_ACCOUNT_ID repo secret if needed
  CLOUDFLARE_ACCOUNT_ID: 2fa3f2f325707bab89ef1c7452d3adb8
  PLAY_STORE_URL: https://play.google.com/store/apps/details?id=com.jarvis.callblocker

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5

      - name: Enforce Google Play download links
        run: |
          set -euo pipefail
          # Safety net: rewrite any legacy APK / download-page link that another agent added.
          bash scripts/apply-play-store-links.sh .
          # Guard: no <a> may still point at the APK or the legacy /download page.
          if grep -rEl '<a[^>]*href="(https://spaminthai\.com)?/download(/spaminthai-latest\.apk)?[?"]' . --include='*.html' --include='render-number-page.js' --exclude-dir=vps --exclude-dir=node_modules --exclude-dir=.git; then
            echo "::error::Legacy APK/download links found in the site (see files above) — every app download button must link to $PLAY_STORE_URL"
            exit 1
          fi
          for f in ads.txt _headers index.html check.html; do
            [ -f "$f" ] || { echo "::error::$f missing"; exit 1; }
          done
          grep -q 'ca-pub-2455374115304550' index.html || { echo "::error::AdSense verification tag missing from index.html (see AGENTS.md)"; exit 1; }
          echo "OK: all app download links point to $PLAY_STORE_URL"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Resolve Cloudflare credentials
        id: cf
        env:
          INPUT_TOKEN: ${{ inputs.cloudflare_api_token }}
          SECRET_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SECRET_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TOKEN="${INPUT_TOKEN:-${SECRET_TOKEN:-}}"
          if [ -z "$TOKEN" ]; then
            echo "::error title=Missing Cloudflare token::Add repository secret CLOUDFLARE_API_TOKEN (Account → Cloudflare Pages → Edit). See .github/SECRETS-SETUP.md"
            exit 1
          fi

          ACCOUNT="${SECRET_ACCOUNT:-2fa3f2f325707bab89ef1c7452d3adb8}"
          PROJECT="${PAGES_PROJECT:-spaminthai}"
          # Account-owned tokens (cfat_) do not work with /user/tokens/verify.
          # Deploy-only tokens may lack Account Read; Pages project GET is enough.
          if [[ "$TOKEN" == cfat_* ]]; then
            curl -fsS "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT}/pages/projects/${PROJECT}" \
              -H "Authorization: Bearer $TOKEN" > /tmp/verify.json
          else
            curl -fsS "https://api.cloudflare.com/client/v4/user/tokens/verify" \
              -H "Authorization: Bearer $TOKEN" > /tmp/verify.json
          fi
          python3 -c "import json; d=json.load(open('/tmp/verify.json')); assert d.get('success'), d"

          echo "account_id=$ACCOUNT" >> "$GITHUB_OUTPUT"
          echo "Cloudflare token verified for account $ACCOUNT"

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ inputs.cloudflare_api_token || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cf.outputs.account_id }}
          command: pages deploy . --project-name=${{ env.PAGES_PROJECT }} --branch=main --commit-dirty=true

      - name: Verify deployment
        run: |
          set -euo pipefail
          echo "Checking Pages preview..."
          curl -fsSI "https://${PAGES_PROJECT}.pages.dev/" | head -1
          curl -fsS "https://${PAGES_PROJECT}.pages.dev/api/app" | python3 -c "import json,sys,os; d=json.load(sys.stdin); assert d.get('version'); assert d.get('downloadUrl')==os.environ['PLAY_STORE_URL'], d"
          # grep the saved file (not `echo | grep -q`): under pipefail a SIGPIPE on echo fails the pipeline spuriously
          curl -fsS "https://${PAGES_PROJECT}.pages.dev/" -o /tmp/home.html
          grep -q '0a0e1a' /tmp/home.html && echo "OK: dark landing theme detected" || echo "WARN: dark theme token not found in HTML"
          grep -q '/api/lookup' /tmp/home.html && echo "OK: check widget wired to /api/lookup" || echo "WARN: /api/lookup not found in homepage"
          if grep -qF -- "$PLAY_STORE_URL" /tmp/home.html; then echo "OK: Google Play download link present"; else echo "::error::Google Play download link missing from homepage"; exit 1; fi
          if grep -q 'spaminthai-latest.apk' /tmp/home.html; then echo "::error::Legacy APK link still present on homepage"; exit 1; else echo "OK: no legacy APK links"; fi
          grep -q 'ca-pub-2455374115304550' /tmp/home.html && echo "OK: AdSense verification present" || echo "WARN: AdSense verification tag missing"
          curl -fsS -o /dev/null -w '%{http_code} %{redirect_url}\n' "https://${PAGES_PROJECT}.pages.dev/download/spaminthai-latest.apk" | grep -qF -- "302 $PLAY_STORE_URL" && echo "OK: legacy APK path redirects to Google Play" || echo "WARN: legacy APK path does not 302 to Google Play"
