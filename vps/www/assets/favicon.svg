<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SpamInThai">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071525"/>
      <stop offset="100%" stop-color="#0a1e36"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <!-- corner brackets -->
  <path d="M10 18V12h6M54 18V12h-6M10 46v6h6M54 46v6h-6" fill="none" stroke="#00d4ff" stroke-width="1.6" stroke-linecap="round"/>
