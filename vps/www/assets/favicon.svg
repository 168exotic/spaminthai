  <circle cx="32" cy="22.2" r="0.9" fill="#0a1e36"/>
  <!-- signal arcs -->
  <path d="M28.5 18.2c2-2 5-2 7 0" fill="none" stroke="#00e5ff" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M26.8 16.2c3.2-3.2 7.2-3.2 10.4 0" fill="none" stroke="#00e5ff" stroke-width="1.2" stroke-linecap="round" opacity=".85"/>
  <!-- block -->
